<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Cache-Control" content="no-cache">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>ZX-filemanager</title>
	<link rel="icon" type="image/ico" href="favicon.ico">
	<style>
		:root {
			color-scheme: light dark;
			--bg: #f4f6f8;
			--surface: #ffffff;
			--surface-2: #eef1f5;
			--border: #d8dee6;
			--text: #1f2933;
			--text-muted: #64748b;
			--accent: #e8742a;
			--accent-hover: #cf641f;
			--accent-active: #b85412;
			--danger: #c0392b;
			--danger-hover: #a93226;
			--success: #1e8449;
			--shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
			--radius: 10px;
			--mono: "Segoe UI", system-ui, sans-serif;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #121417;
				--surface: #1b1f24;
				--surface-2: #252a31;
				--border: #343b45;
				--text: #e8edf3;
				--text-muted: #9aa7b5;
				--accent: #f08a3c;
				--accent-hover: #ff9a4d;
				--accent-active: #e8742a;
				--danger: #e74c3c;
				--danger-hover: #ff6b5a;
				--success: #2ecc71;
				--shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: var(--mono);
			background: var(--bg);
			color: var(--text);
			line-height: 1.45;
		}

		.app {
			max-width: 1520px;
			margin: 0 auto;
			padding: 16px;
		}

		.header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 16px;
		}

		.header h1 {
			margin: 0;
			font-size: 1.35rem;
			font-weight: 600;
		}

		.header-actions {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
		}

		.panel {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			padding: 14px;
			margin-bottom: 14px;
		}

		.toolbar {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
		}

		.toolbar-group {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
		}

		.toolbar-group.toolbar-end {
			margin-left: auto;
		}

		.toolbar-divider {
			width: 1px;
			height: 28px;
			background: var(--border);
			margin: 0 4px;
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
			border: 1px solid transparent;
			border-radius: 8px;
			padding: 8px 12px;
			font: inherit;
			font-size: 0.92rem;
			cursor: pointer;
			text-decoration: none;
			background: var(--accent);
			color: #fff;
			transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
		}

		.btn:hover {
			background: var(--accent-hover);
		}

		.btn:active {
			background: var(--accent-active);
		}

		.btn:disabled {
			opacity: 0.55;
			cursor: not-allowed;
		}

		.btn-secondary {
			background: var(--surface-2);
			color: var(--text);
			border-color: var(--border);
		}

		.btn-secondary:hover {
			background: var(--border);
		}

		.btn-danger {
			background: var(--danger);
		}

		.btn-danger:hover {
			background: var(--danger-hover);
		}

		.btn-sm {
			padding: 5px 8px;
			font-size: 0.82rem;
			border-radius: 6px;
		}

		.input {
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 8px 10px;
			font: inherit;
			background: var(--surface);
			color: var(--text);
			min-width: 180px;
		}

		.input:focus {
			outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
			border-color: var(--accent);
		}

		.lang-select {
			min-width: 7.5rem;
			padding-top: 7px;
			padding-bottom: 7px;
		}

		.status {
			min-height: 1.4em;
			font-size: 0.92rem;
			color: var(--text-muted);
		}

		.status.error {
			color: var(--danger);
		}

		.status.success {
			color: var(--success);
		}

		.breadcrumbs {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
			align-items: center;
			margin-bottom: 12px;
			font-size: 0.95rem;
		}

		.breadcrumbs a {
			color: var(--accent);
			text-decoration: none;
		}

		.breadcrumbs a:hover {
			text-decoration: underline;
		}

		.breadcrumbs .sep {
			color: var(--text-muted);
		}

		.breadcrumbs .current {
			color: var(--text);
			font-weight: 700;
		}

		.dropzone {
			border: 2px dashed var(--border);
			border-radius: var(--radius);
			padding: 14px;
			text-align: center;
			color: var(--text-muted);
			margin-bottom: 12px;
			transition: border-color 0.15s ease, background 0.15s ease;
		}

		.dropzone.dragover {
			border-color: var(--accent);
			background: color-mix(in srgb, var(--accent) 8%, transparent);
			color: var(--text);
		}

		.file-table-wrap {
			overflow-x: auto;
		}

		table.files {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.92rem;
		}

		table.files th,
		table.files td {
			padding: 10px 8px;
			border-bottom: 1px solid var(--border);
			text-align: left;
			vertical-align: middle;
		}

		table.files th {
			color: var(--text-muted);
			font-weight: 600;
			font-size: 0.82rem;
			text-transform: uppercase;
			letter-spacing: 0.03em;
		}

		table.files tr:hover td {
			background: color-mix(in srgb, var(--accent) 6%, transparent);
		}

		table.files tr:last-child td {
			border-bottom: none;
		}

		.file-name {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			word-break: break-all;
		}

		.file-name a {
			color: var(--text);
			text-decoration: none;
			font-weight: 500;
		}

		.file-name a:hover {
			color: var(--accent);
		}

		.file-icon {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 1.35em;
			height: 1.35em;
			flex-shrink: 0;
		}

		.file-icon svg {
			display: block;
		}

		.ico-folder {
			color: var(--accent);
		}

		.ico-up {
			color: var(--text-muted);
		}

		.ico-file {
			color: var(--text-muted);
		}

		.actions {
			display: grid;
			grid-template-columns: 5rem 8.6rem 5.6rem;
			gap: 6px;
			align-items: center;
			width: max-content;
		}

		.actions .action-dl,
		.actions .action-del,
		.actions .action-run {
			width: 100%;
			justify-content: center;
			text-align: center;
		}

		.actions .action-extra {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			min-width: 5rem;
		}

		.actions .action-extra .action-run {
			min-width: 5rem;
			padding-left: 10px;
			padding-right: 10px;
		}

		.progress-wrap {
			display: none;
			margin-top: 10px;
		}

		.progress-wrap.active {
			display: block;
		}

		.progress-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			margin-bottom: 6px;
		}

		.progress-label {
			font-size: 0.88rem;
			color: var(--text-muted);
			flex: 1;
			min-width: 0;
			word-break: break-word;
		}

		.progress-bar {
			height: 8px;
			background: var(--surface-2);
			border-radius: 999px;
			overflow: hidden;
		}

		.progress-bar > span {
			display: block;
			height: 100%;
			width: 0;
			background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #fff));
			transition: width 0.15s ease;
		}

		.hidden-input {
			display: none;
		}

		.empty-state {
			padding: 28px 12px;
			text-align: center;
			color: var(--text-muted);
		}

		.selection-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			flex-wrap: wrap;
			margin-bottom: 12px;
			padding: 10px 12px;
			border: 1px solid var(--border);
			border-radius: var(--radius);
			background: var(--surface-2);
			opacity: 0.72;
			transition: opacity 0.15s ease, border-color 0.15s ease, background 0.15s ease;
		}

		.selection-bar.active {
			opacity: 1;
			border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
			background: color-mix(in srgb, var(--accent) 10%, var(--surface));
		}

		.selection-badge {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 1.6rem;
			height: 1.6rem;
			padding: 0 6px;
			border-radius: 999px;
			background: var(--text-muted);
			color: #fff;
			font-size: 0.82rem;
			font-weight: 600;
		}

		.selection-bar.active .selection-badge {
			background: var(--accent);
		}

		.selection-info {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 0.92rem;
			color: var(--text);
		}

		.selection-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		table.files th.select-cell,
		table.files td.select-cell {
			width: 2.4rem;
			padding-left: 10px;
			padding-right: 4px;
			text-align: center;
		}

		table.files .row-select,
		table.files #selectAll {
			width: 1rem;
			height: 1rem;
			margin: 0;
			cursor: pointer;
			accent-color: var(--accent);
		}

		table.files tr.selected td {
			background: color-mix(in srgb, var(--accent) 12%, transparent);
		}

		table.files tr.selected:hover td {
			background: color-mix(in srgb, var(--accent) 16%, transparent);
		}

		table.files.selection-mode .actions .btn,
		table.files.selection-mode .actions a.btn.disabled {
			opacity: 0.45;
			cursor: not-allowed;
			pointer-events: none;
		}

		table.files th:nth-child(2),
		table.files td:nth-child(2) {
			width: 70ch;
			min-width: 70ch;
			max-width: 70ch;
			padding-right: 12px;
		}

		table.files th:nth-child(3),
		table.files td:nth-child(3) {
			width: 6.5rem;
			white-space: nowrap;
		}

		table.files th:nth-child(4),
		table.files td:nth-child(4) {
			width: 10.5rem;
			white-space: nowrap;
		}

		table.files td.actions-cell,
		table.files th.actions-cell {
			width: 1%;
			white-space: nowrap;
			padding-left: 2.5rem;
		}

		.app.app-busy .app-main {
			pointer-events: none;
			opacity: 0.58;
			user-select: none;
		}

		.app.app-busy .app-main .btn,
		.app.app-busy .app-main a,
		.app.app-busy .app-main input,
		.app.app-busy .app-main .dropzone {
			cursor: not-allowed;
		}

		@media (max-width: 720px) {
			.header {
				flex-direction: column;
				align-items: stretch;
			}

			.toolbar-divider {
				display: none;
			}
		}

		.mobile-ui {
			-webkit-tap-highlight-color: transparent;
		}

		.mobile-ui .app {
			display: flex;
			flex-direction: column;
			padding: 10px;
			padding-left: max(10px, env(safe-area-inset-left));
			padding-right: max(10px, env(safe-area-inset-right));
			padding-bottom: max(10px, env(safe-area-inset-bottom));
		}

		.mobile-ui .app-main {
			display: contents;
		}

		.mobile-ui .header {
			order: 1;
		}

		.mobile-ui .toolbar-panel {
			order: 2;
			position: sticky;
			top: 0;
			z-index: 20;
		}

		.mobile-ui .status-panel.status-panel-empty {
			display: none;
		}

		.mobile-ui .status-panel {
			order: 3;
			margin-bottom: 10px;
			padding: 8px 10px;
		}

		.mobile-ui .app-main > .panel:not(.toolbar-panel) {
			order: 4;
		}

		.mobile-ui .panel {
			padding: 9px;
			margin-bottom: 8px;
		}

		.mobile-ui .header h1 {
			font-size: 1.15rem;
		}

		.mobile-ui .header-actions {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 6px;
		}

		.mobile-ui .header-actions .lang-select {
			grid-column: 1 / -1;
			width: 100%;
			min-height: 33px;
			font-size: 0.75rem;
		}

		.mobile-ui .header-actions .btn,
		.mobile-ui .header-actions a.btn {
			min-height: 33px;
			width: 100%;
			font-size: 0.75rem;
			padding: 6px 9px;
		}

		.mobile-ui .status {
			font-size: 0.82rem;
			line-height: 1.35;
		}

		.mobile-ui .progress-label {
			font-size: 0.78rem;
		}

		.mobile-ui .toolbar {
			flex-direction: column;
			align-items: stretch;
		}

		.mobile-ui .toolbar-group {
			width: 100%;
			margin-left: 0;
			flex-direction: column;
			align-items: stretch;
		}

		.mobile-ui .input,
		.mobile-ui .toolbar .btn,
		.mobile-ui .toolbar .input {
			min-height: 33px;
			width: 100%;
			font-size: 0.75rem;
			padding: 6px 9px;
			touch-action: manipulation;
		}

		.mobile-ui .toolbar-group.toolbar-end {
			flex-direction: row;
			flex-wrap: nowrap;
			gap: 6px;
		}

		.mobile-ui .toolbar-group.toolbar-end .btn,
		.mobile-ui #btnMuteGs,
		.mobile-ui #btnMuteAy {
			flex: 1 1 0;
			min-width: 0;
			width: auto;
			min-height: 33px;
			font-size: 0.75rem;
			padding: 6px 9px;
			touch-action: manipulation;
		}

		.mobile-ui .btn-sm {
			padding: 4px 6px;
			font-size: 0.69rem;
		}

		.mobile-ui #btnUploadFolder {
			display: none;
		}

		.mobile-ui .dropzone {
			display: none !important;
		}

		.mobile-ui .selection-bar {
			display: none !important;
		}

		.mobile-ui .breadcrumbs {
			font-size: 0.9rem;
			margin-bottom: 10px;
			line-height: 1.5;
		}

		.mobile-ui .file-table-wrap {
			overflow: visible;
		}

		.mobile-ui .file-cards {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.mobile-ui .file-card {
			border: 1px solid var(--border);
			border-radius: var(--radius);
			background: var(--surface-2);
			padding: 9px;
		}

		.mobile-ui .file-card.selected {
			border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
			background: color-mix(in srgb, var(--accent) 10%, var(--surface));
		}

		.mobile-ui .file-card-main {
			margin: -9px -9px 0;
		}

		.mobile-ui .file-card-main:last-child {
			margin-bottom: -9px;
		}

		.mobile-ui .file-card-nav {
			display: block;
			width: 100%;
			box-sizing: border-box;
			padding: 9px;
			color: inherit;
			text-decoration: none;
			border-radius: var(--radius);
			touch-action: manipulation;
			cursor: pointer;
		}

		.mobile-ui .file-card-nav:active {
			background: color-mix(in srgb, var(--accent) 12%, var(--surface-2));
		}

		.mobile-ui .file-card .file-name {
			font-size: 0.84rem;
			line-height: 1.35;
		}

		.mobile-ui .file-card-nav .file-name {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			word-break: break-all;
			font-weight: 500;
		}

		.mobile-ui .file-card-meta {
			margin-top: 4px;
			font-size: 0.72rem;
			color: var(--text-muted);
			word-break: break-word;
		}

		.mobile-ui .file-card-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			margin-top: 10px;
			align-items: stretch;
		}

		.mobile-ui .file-card-actions .btn {
			width: auto;
			box-sizing: border-box;
			min-height: 33px;
			padding: 6px 8px;
			font-size: 0.75rem;
			touch-action: manipulation;
		}

		.mobile-ui .file-card-actions .action-del,
		.mobile-ui .file-card-actions .action-dl,
		.mobile-ui .file-card-actions .action-run {
			flex: 1 1 calc(50% - 3px);
			min-width: 0;
			max-width: none;
		}

		.mobile-ui .file-card-actions:has(.action-run) .action-dl {
			flex: 1 1 100%;
		}

		.mobile-ui .file-card-actions .action-extra {
			display: contents;
		}

		.mobile-ui .progress-head {
			flex-wrap: wrap;
		}

		.mobile-ui #btnCancelProgress {
			min-height: 33px;
			width: 100%;
			font-size: 0.75rem;
		}

		.mobile-ui table.files {
			display: none;
		}

		.version-switch {
			position: fixed;
			top: max(8px, env(safe-area-inset-top, 0px));
			right: max(10px, env(safe-area-inset-right, 0px));
			z-index: 40;
			font-size: 0.72rem;
			line-height: 1.2;
			color: var(--text-muted);
			text-decoration: none;
			opacity: 0.85;
		}

		.version-switch:hover {
			color: var(--accent);
			text-decoration: underline;
			opacity: 1;
		}
	</style>
	<script>
		(function() {
			try {
				if (localStorage.getItem('3ws-ui-version') === 'legacy') {
					var path = location.pathname || '/';
					var base = path.replace(/\/index\.htm?$/i, '/').replace(/\/legacy(\/[^/]*)?\/?$/i, '/');
					if (base.charAt(base.length - 1) !== '/') {
						base += '/';
					}
					location.replace(base + 'legacy/index.htm');
				}
			} catch (e) {}
		})();
	</script>
</head>

<body>
	<a href="javascript:switchToLegacyVersion()" class="version-switch" id="linkOldVersion"></a>
	<div class="app" id="app">
		<div class="panel status-panel status-panel-empty" id="statusPanel">
			<div class="status" id="log"></div>
			<div class="progress-wrap" id="progressWrap">
				<div class="progress-head">
					<div class="progress-label" id="progressLabel"></div>
					<button type="button" class="btn btn-secondary btn-sm" id="btnCancelProgress" style="display:none"></button>
				</div>
				<div class="progress-bar"><span id="progressBar"></span></div>
			</div>
		</div>

		<div class="app-main" id="appMain">
		<header class="header">
			<h1 id="appTitle">ZX File Manager</h1>
			<div class="header-actions">
				<select id="langSelect" class="input lang-select" aria-label="Language">
					<option value="ru">Russian</option>
					<option value="en">English</option>
				</select>
				<button type="button" class="btn btn-secondary" id="btnRefresh"></button>
				<a class="btn btn-danger btn-sm" id="btnStopDaemon" href="javascript:stopDaemon()"></a>
			</div>
		</header>

		<div class="panel toolbar-panel">
			<div class="toolbar">
				<div class="toolbar-group">
					<input type="text" id="dirName" class="input" placeholder="">
					<button type="button" class="btn" id="btnMkdir"></button>
				</div>
				<div class="toolbar-divider"></div>
				<div class="toolbar-group">
					<button type="button" class="btn btn-secondary" id="btnUploadFiles"></button>
					<button type="button" class="btn btn-secondary" id="btnUploadFolder"></button>
				</div>
				<div class="toolbar-divider"></div>
				<div class="toolbar-group toolbar-end">
					<button type="button" class="btn btn-secondary" id="btnMuteGs"></button>
					<button type="button" class="btn btn-secondary" id="btnMuteAy"></button>
				</div>
			</div>
			<input type="file" id="fileToUp" class="hidden-input" multiple>
			<input type="file" id="folderToUp" class="hidden-input" webkitdirectory directory multiple>
		</div>

		<div class="panel">
			<div class="breadcrumbs" id="breadcrumbs"></div>
			<div class="selection-bar" id="selectionBar">
				<div class="selection-info">
					<span class="selection-badge" id="selectionCount">0</span>
					<span id="selectionLabel"></span>
				</div>
				<div class="selection-actions">
					<button type="button" class="btn btn-secondary btn-sm" id="btnDownloadSelected"></button>
					<button type="button" class="btn btn-danger btn-sm" id="btnDeleteSelected"></button>
					<button type="button" class="btn btn-secondary btn-sm" id="btnClearSelection"></button>
				</div>
			</div>
			<div class="dropzone" id="dropzone"></div>
			<div class="file-table-wrap">
				<div id="divlog"></div>
			</div>
		</div>
		</div>
	</div>

	<script src="my.js" type="text/javascript"></script>
</body>
